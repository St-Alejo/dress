name: vestirse

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vestirse
      POSTGRES_PASSWORD: vestirse
      POSTGRES_DB: vestirse
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vestirse"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vestirse
      MINIO_ROOT_PASSWORD: vestirse-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  # Crea el bucket y la regla de expiración automática (sección 8, punto 2):
  # las fotos subidas bajo uploads/ se borran solas tras 1 día, además del cron de la API.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 vestirse vestirse-secret &&
      mc mb --ignore-existing local/vestirse &&
      mc ilm rule add --expire-days 1 --prefix uploads/ local/vestirse || true &&
      mc anonymous set download local/vestirse/catalog &&
      echo 'bucket listo'
      "

  ai-worker:
    build: ../services/ai-worker
    environment:
      TRYON_ENGINE: ${TRYON_ENGINE:-mock}
      MOCK_DELAY_SECONDS: ${MOCK_DELAY_SECONDS:-4}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      FAL_KEY: ${FAL_KEY:-}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5

volumes:
  pgdata:
  miniodata:
