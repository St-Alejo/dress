[project]
name = "vestirse-ai-worker"
version = "0.1.0"
description = "Track B: prueba virtual de prenda (Spaces de Hugging Face, APIs hospedadas o mock)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pillow>=11",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.20",
  "gradio_client>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.22"]
# Solo para preparar el catálogo (no entra en la imagen Docker). torch conviene instalarlo antes
# desde https://download.pytorch.org/whl/cpu para no bajar la versión con CUDA.
tools = ["rembg[cpu]>=2.0.60", "transformers>=5.0", "torch>=2.6", "torchvision>=0.21", "scipy>=1.13"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
