[project]
name = "vestirse-ai-worker"
version = "0.1.0"
description = "Track B: transferencia fotorrealista de prenda (CatVTON vía API hospedada o mock)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pillow>=11",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.22"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
