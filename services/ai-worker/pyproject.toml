[project]
name = "vestirse-ai-worker"
version = "0.1.0"
description = "Track B: prueba virtual de prenda (Spaces de Hugging Face, APIs hospedadas o mock)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pillow>=11",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.20",
  "gradio_client>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.22"]
# Solo para preparar el catálogo (scripts/prepare_catalog.py); no va en la imagen del worker.
tools = ["rembg[cpu]>=2.0.60"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
