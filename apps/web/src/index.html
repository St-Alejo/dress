<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Vestirse · Probador virtual</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Probador de ropa virtual: mira la prenda en un cuerpo como el tuyo, pruébala con tu cámara y encuentra tu talla con honestidad." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Tema resuelto antes de pintar (evita el destello claro en modo oscuro). Ver core/theme.ts.
      (function () {
        try {
          var pref = JSON.parse(localStorage.getItem('vestirse:theme') || '"system"');
          var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Vestirse necesita JavaScript para funcionar.</noscript>
  </body>
</html>
